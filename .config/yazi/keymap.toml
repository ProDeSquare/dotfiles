[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter"

[[mgr.prepend_keymap]]
on   = "j"
run  = "arrow 1"
desc = "Cursor down"

[[mgr.prepend_keymap]]
on   = "k"
run  = "arrow -1"
desc = "Cursor up"

# Basic functions
[[mgr.prepend_keymap]]
on   = "."
run  = "hidden toggle"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on   = "y"
run  = "yank"
desc = "Yank files"

[[mgr.prepend_keymap]]
on   = "d"
run  = "yank --cut"
desc = "Cut files"

[[mgr.prepend_keymap]]
on   = "c"
run  = "unyank"
desc = "Clear selection"

[[mgr.prepend_keymap]]
on   = [ "D", "D" ]
run  = "remove --permanently"
desc = "Delete selected"

[[mgr.prepend_keymap]]
on   = "r"
run  = "rename --cursor=before_ext"
desc = "Rename"

[[mgr.prepend_keymap]]
on   = "r"
run  = "rename --cursor=before_ext"
desc = "Rename"

# Trash
[[mgr.prepend_keymap]]
on   = [ "d", "d" ]
run  = 'shell -- trash-put "$@"'
desc = "Move selected files to trash"

[[mgr.prepend_keymap]]
on   = [ "t", "c" ]
run  = "shell -- trash-empty"
desc = "Empty trash"

[[mgr.prepend_keymap]]
on   = [ "t", "r" ]
run  = "shell --block -- trash-restore"
desc = "Restore trashed files"

# Wallpaper
[[mgr.prepend_keymap]]
on   = [ "b", "g" ]
run  = 'shell -- setbg %h'
desc = "Set wallpaper"

[[mgr.prepend_keymap]]
on   = [ "b", "b" ]
run  = 'shell -- setwall %h'
desc = "Set temp wallpaper"

[[mgr.prepend_keymap]]
on   = [ "g", "j", "p", "g" ]
run  = 'shell -- magick "%s" "%s.jpg"'
desc = "Convert image to JPG"

[[mgr.prepend_keymap]]
on   = [ "a", "u" ]
run  = "plugin run-hovered unarchive"
desc = "Unarchive file"

# Go-to shortcuts
[[mgr.prepend_keymap]]
on   = [ "g", "t", "c" ]
run  = "cd ~/.config"
desc = "Go to ~/.config"

[[mgr.prepend_keymap]]
on   = [ "g", "t", "b" ]
run  = "cd ~/.local/bin"
desc = "Go to ~/.local/bin"

[[mgr.prepend_keymap]]
on   = [ "g", "t", "s" ]
run  = "cd ~/.local/share"
desc = "Go to ~/.local/share"

[[mgr.prepend_keymap]]
on   = [ "g", "t", "v" ]
run  = "cd ~/docx/videos"
desc = "Go to ~/docx/videos"

[[mgr.prepend_keymap]]
on   = [ "g", "t", "p" ]
run  = "cd ~/docx/pictures"
desc = "Go to ~/docx/pictures"

[[mgr.prepend_keymap]]
on   = [ "g", "t", "e" ]
run  = "cd ~/docx/entertainment"
desc = "Go to ~/docx/entertainment"

[[mgr.prepend_keymap]]
on   = [ "g", "e", "m" ]
run  = "cd ~/docx/entertainment/movies"
desc = "Go to ~/docx/entertainment/movies"

[[mgr.prepend_keymap]]
on   = [ "g", "e", "s" ]
run  = "cd ~/docx/entertainment/seasons"
desc = "Go to ~/docx/entertainment/seasons"

[[mgr.prepend_keymap]]
on   = [ "g", "p", "w" ]
run  = "cd ~/docx/pictures/wallpapers"
desc = "Go to ~/docx/pictures/wallpapers"

[[mgr.prepend_keymap]]
on   = [ "g", "p", "s" ]
run  = "cd ~/docx/pictures/screenshots"
desc = "Go to ~/docx/pictures/screenshots"

[[mgr.prepend_keymap]]
on   = [ "g", "t", "m" ]
run  = "cd /mnt/"
desc = "Go to /mnt/"
